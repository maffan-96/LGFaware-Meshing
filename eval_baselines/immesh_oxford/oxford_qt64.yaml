# ImMesh config for the Oxford Spires dataset (Frontier handheld:
# Hesai QT64 @10 Hz + Alphasense Core IMU @400 Hz).
# Copy into $ImMesh$/config/ and launch with mapping_oxford_qt64.launch.
#
# Derived from ImMesh's config/velodyne.yaml with:
#   - topics from the Oxford Spires rosbags (/hesai/pandar, /alphasense_driver_ros/imu)
#   - IMU enabled, with T_imu_lidar computed from the dataset's
#     configs/sensor.yaml (T_cam_imu^-1 * T_cam_lidar of the front camera):
#     ~91 deg yaw between LiDAR and IMU + [0.65, -15.5, 84.6] mm offset.
#   - QT64 geometry: 64-line spinning lidar, 360 deg FOV.
#
# Note on per-point time: the Hesai driver stamps points in a field named
# "timestamp" (absolute, double); ImMesh's velodyne handler looks for
# "time" (relative, float). The missing field decays to zeros, and the
# handler then falls back to computing per-point offsets from the azimuth,
# which is correct for a constant-rate spinning lidar. Expect a one-time
# PCL "Failed to find match for field 'time'" warning - harmless.

feature_extract_enable: 0
point_filter_num: 1
max_iteration: 3
dense_map_enable: 0
filter_size_surf: 0.5
filter_size_map: 0.5
cube_side_length: 1000
debug: 0
min_img_count: 150000

grid_size: 40
patch_size: 8
img_enable: 0
lidar_enable: 1
outlier_threshold: 78
img_point_cov: 1000
laser_point_cov: 0.001

common:
    lid_topic: "/hesai/pandar"
    imu_topic: "/alphasense_driver_ros/imu"

preprocess:
    lidar_type: 5                # XT32 = Hesai Pandar handler (present in stock ImMesh);
                                 # parses the QT64's absolute double timestamp + ring fields
    scan_line: 64                # QT64: 64 channels
    blind: 1.0                   # per ori-drs/ImMesh_hesai hesai_ox.yaml

mapping:
    imu_en: true
    imu_int_frame: 30
    # IMU noise + extrinsics below are the ORI group's own values from
    # ori-drs/ImMesh_hesai config/hesai_ox.yaml (calibrated for the
    # Frontier handheld used in New College / Oxford Spires).
    acc_cov: 5.0
    gyr_cov: 0.3
    b_acc_cov: 0.01
    b_gyr_cov: 0.01
    fov_degree: 180
    extrinsic_T: [ -0.00459163, -0.00200303, -0.0547992 ]
    extrinsic_R: [ -0.0106465,  -0.999911,   0.00806769,
                    0.999941,   -0.0106296,  0.00171369,
                   -0.00166849,  0.00808546, 0.999966 ]

voxel:
    voxel_map_en: true
    pub_plane_en: false
    dept_err: 0.04
    beam_err: 0.1
    min_eigen_value: 0.01
    match_s: 0.9
    sigma_num: 3
    voxel_size: 3
    max_layer: 4
    max_points_size: 1000
    layer_init_size: [5, 5, 5, 5, 5]

publish:
    path_en: false
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    effect_point_pub: true
    pub_point_skip: 5

pcd_save:
    pcd_save_en: false
    type: 0
    interval: -1

img_save:
    img_save_en: false
    rot_dist: 0.0
    pos_dist: 0.0
    interval: 1

meshing:
    points_minimum_scale: 0.1
    voxel_resolution: 0.4
    region_size: 10.0
    number_of_pts_append_to_map: 10000
    if_draw_mesh: 1
