# Meshing parameters for a Livox Mid-360 driven by the Super-LIO front-end.
#
# Super-LIO's own parameters live in super_lio/config/livox_360.yaml and are
# loaded separately by mapping_mid360_superlio.launch. Three of them must hold
# for this node to work, because point clouds and poses are paired by arrival
# order, not by timestamp:
#
#   output.map      true   -> otherwise /lio/cloud_world is never published
#   output.pub_step 1      -> odometry is published every scan but the cloud
#                             only every pub_step-th scan, so any other value
#                             desyncs the pairing permanently
#   output.dense    true   -> publish the full undistorted scan
#
# NOTE: keep this file pure ASCII. rosparam decodes it with the system locale,
# so non-ASCII comments can be read as latin-1 and rejected as invalid YAML.
mesh:
    hole_every_n_frame: 5               # run hole filling and connection every n frames
    # Range image size: H = (up+down)/res + 2*r_kNN + 12, W = fov_horizon/res + 2*r_kNN + 12
    # 90/90 covers the full range atan() can return, so no point is ever dropped.
    angle_resolution: 0.5               # -> H=382, W=742
    fov_horizon: 360
    fov_vertical_up: 90
    fov_vertical_down: 90
    r_kNN: 5                            # half width of the window used for normal estimation
    depth_th_normal: 0.5                # max depth difference to the center point inside that window
    eigenvalue_threshold: 0.0001        # threshold to seed an initial plane point
    angle_threshold: 10                 # region growing, normal angle similarity, deg
    depth_threshold: 0.03               # region growing, distance along the normal, m
    angle_th_spd: 10                    # similar plane detection, normal angle threshold
    dis_th_spd: 0.03                    # similar plane detection, distance along the normal
    ptsNum_threshold: 40                # minimum number of points for a plane
    dis_resolution: 0.1                 # size of plane grid
    grid_ptsNum_threshold: 4            # threshold to define occupancy of plane grid
    ptsNum_decimate_threshold: 1000     # whether the point projection matrix is recomputed
    voxel_resolution: 0.2               # size of non-plane voxel
    points_minimum_scale: 0.05          # minimum distance between any two non-plane points
    r_nonplane: 0.1                     # nearest neighbor search distance in non-plane process
    N_nonplane: 10                      # threshold to fit triangle of isolated points
    max_pts_num: 15000
    if_save_raw_points: false
    if_quadtree_decimate: true          # carry out quadtree decimate or not
    if_gui: false                       # display incremental reconstruction or not
    if_debug: false
    # Super-LIO topics. /lio/odom is the IMU frame at LiDAR rate -- do NOT use
    # /lio/imu/odom or /lio/robo/odom, both run at IMU rate and would desync.
    ptcl_topic: "/lio/cloud_world"
    odo_topic: "/lio/odom"
    # Must point at a directory that already exists.
    ptcl_save_path: "/indoormapping/data/ITC_building_2026/output_onlinemesh/"
    dataset_name: "mid360_superlio"
