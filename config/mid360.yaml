common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
    # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 4
    blind: 0.5
    point_filter_num: 1          # keep every point, the default of 2 halves the density of the range image

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file;
    # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

# NOTE: keep this file pure ASCII. rosparam decodes it with the system locale,
# so non-ASCII comments can be read as latin-1 and rejected as invalid YAML.
mesh:
    hole_every_n_frame: 5               # run hole filling and connection every n frames
    # Range image size: H = (up+down)/res + 2*r_kNN + 12, W = fov_horizon/res + 2*r_kNN + 12
    # The Mid-360 datasheet FOV is 360 deg horizontal, -7 to +52 deg vertical, but the
    # projection happens in the odometry body frame, where pitch angles exceed that range.
    # Extra vertical margin is deliberate: out-of-range points are dropped and leave holes.
    angle_resolution: 0.5               # -> H=292, W=742
    fov_horizon: 360
    fov_vertical_up: 55
    fov_vertical_down: 80
    r_kNN: 5                            # half width of the window used for normal estimation
    depth_th_normal: 0.5                # max depth difference to the center point inside that window
    eigenvalue_threshold: 0.0001        # threshold to seed an initial plane point
    angle_threshold: 10                 # region growing, normal angle similarity, deg
    depth_threshold: 0.03               # region growing, distance along the normal, m
    angle_th_spd: 10                    # similar plane detection, normal angle threshold
    dis_th_spd: 0.03                    # similar plane detection, distance along the normal
    ptsNum_threshold: 40                # minimum number of points for a plane
    dis_resolution: 0.1                 # size of plane grid
    grid_ptsNum_threshold: 4            # threshold to define occupancy of plane grid
    ptsNum_decimate_threshold: 1000     # whether the point projection matrix is recomputed
    voxel_resolution: 0.2               # size of non-plane voxel
    points_minimum_scale: 0.05          # minimum distance between any two non-plane points
    r_nonplane: 0.1                     # nearest neighbor search distance in non-plane process
    N_nonplane: 10                      # threshold to fit triangle of isolated points
    max_pts_num: 15000
    if_save_raw_points: false
    if_quadtree_decimate: true          # carry out quadtree decimate or not
    if_gui: true                        # display incremental reconstruction or not
    if_debug: false
    ptcl_topic: "/cloud_registered"
    odo_topic: "/Odometry"
    # Must point at a directory that already exists. mkdir here is not recursive and its
    # result is unchecked, so a missing parent crashes the node on the first fopen.
    ptcl_save_path: "/home/YOUR_USER_NAME/output_onlinemesh"
    dataset_name: "mid360"
